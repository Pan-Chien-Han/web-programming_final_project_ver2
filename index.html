<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「糧」心大數據 - ESG Impact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9f2;
            --primary-color: #8c9c75;
            --accent-color: #d4a373;
            --quiz-color: #6b8e23;
            --text-color: #4a4a4a;
            --white: #ffffff;
            --error-color: #e76f51;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            padding-top: 20px;
        }
        /* 頂部大圖樣式 */
.hero-banner {
    position: relative;
    width: 100%;
    height: 200px; /* 你可以調整高度 */
    margin-bottom: 40px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* 確保圖片填滿且不變形 */
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.5));
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.hero-overlay h1 {
    /* 使用思源宋體，備用字體設為 serif */
    font-family: 'Noto Serif TC', serif;
    
    /* 設定為最粗的等級 (Black) */
    font-weight: 900; 
    
    /* 字體加大 */
    font-size: 5rem; 
    
    /* 讓字體更有質感的微調 */
    letter-spacing: 0.1em;
    color: #ffffff; /* 確保顏色是純白 */
    text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3); /* 增加層次感 */
    
    /* 置中對齊 */
    text-align: center;
    margin: 0;
}

.hero-overlay p {
    font-size: 1.2rem;
    opacity: 0.9;
}

@media (max-width: 600px) {
    .hero-banner { height: 250px; }
    .hero-overlay h1 { font-size: 1.8rem; }
}
        /* 內容區塊控制 */
        .page-content {
            display: none;
            padding: 40px 25px;
            max-width: 1100px;
            margin: 0 auto;
            min-height: 75vh;
        }
        .page-content.active { display: block; }

        /* 返回按鈕 */
        .btn-back {
            background: none;
            border: 1.5px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .btn-back:hover {
            background: var(--primary-color);
            color: white;
        }

        /* 首頁資訊樣式 */
        .news-placeholder {
            background: var(--white);
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            color: #999;
            border: 2px dashed #e0e0e0;
            margin-bottom: 40px;
        }

        /* 功能引導按鈕 */
        .cta-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .btn-cta {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(140, 156, 117, 0.2);
        }
        .btn-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(140, 156, 117, 0.4);
            filter: brightness(1.05);
        }
        .btn-cta.secondary {
            background-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.2);
        }
        .btn-cta.quiz-theme {
            background-color: var(--quiz-color);
            box-shadow: 0 4px 15px rgba(107, 142, 35, 0.2);
        }

        /* 計算機樣式 */
        .calc-wrapper {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        .calc-form { padding: 40px; }
        .calc-visual { background-color: #f1f3e8; padding: 40px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="number"], select { width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 8px; outline: none; }
        .slider { width: 100%; accent-color: var(--primary-color); }
        .btn-calc { background-color: var(--primary-color); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 10px;}
        .formula-box { background: #fdfdfd; border-left: 5px solid var(--accent-color); padding: 15px; margin-top: 20px; font-size: 0.9rem; display: none; }

        /* 惜食小學堂樣式 - 四選一優化 */
        .quiz-container {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: 20px auto;
        }
        .quiz-question { font-size: 1.25rem; font-weight: 600; margin-bottom: 25px; color: var(--text-color); text-align: left; }
        .quiz-options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-option {
            text-align: left;
            padding: 15px 20px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .btn-option:hover:not([disabled]) {
            background-color: #f9fdf4;
            border-color: var(--primary-color);
        }
        .btn-option.correct {
            background-color: #e9f5db;
            border-color: var(--quiz-color);
            color: #3e4e20;
            font-weight: bold;
        }
        .btn-option.wrong {
            background-color: #fde2e2;
            border-color: var(--error-color);
            color: #7a2a2a;
        }
        .quiz-feedback { 
            margin-top: 20px; 
            padding: 20px; 
            border-radius: 10px; 
            display: none; 
            line-height: 1.6;
            text-align: left;
        }
        .quiz-feedback.success { background-color: #f1f8e9; border: 1px solid var(--primary-color); }
        .quiz-feedback.error { background-color: #fff5f5; border: 1px solid var(--error-color); }

        /* 天平動畫 */
        .balance-icon {
            width: 150px; height: 100px; border-bottom: 4px solid var(--primary-color);
            position: relative; margin-bottom: 20px; transition: transform 0.5s ease;
        }
        .balance-icon::after {
            content: ""; position: absolute; left: 50%; bottom: 0; width: 4px; height: 60px;
            background: var(--primary-color); transform: translateX(-2px);
        }

        /* 連署區塊 */
        .petition-section {
            text-align: center; padding: 60px 0; background: #fff; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02); margin-top: 50px;
        }
        .btn-promise {
            margin-top: 20px; padding: 18px 60px; background: var(--white);
            border: 3px solid var(--accent-color); color: var(--accent-color);
            cursor: pointer; box-shadow: 10px 10px 0px var(--accent-color);
            transition: 0.1s; font-weight: 800; font-size: 1.5rem;
        }
        .btn-promise:active { transform: translate(5px, 5px); box-shadow: 5px 5px 0px var(--accent-color); }
        .count-num { color: var(--accent-color); font-weight: 900; font-size: 1.8rem; margin: 0 5px; }

        /* 地圖佔位 */
        .map-placeholder {
            height: 500px; background-color: #e3eaf0; border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            color: #666; border: 2px solid #d1d9e0;
        }

        footer { text-align: center; padding: 40px; font-size: 0.85rem; color: #aaa; }

        @media (max-width: 850px) {
            .calc-wrapper { grid-template-columns: 1fr; }
            .cta-container { flex-direction: column; align-items: center; }
            .btn-cta { width: 100%; justify-content: center; }
        }
        /* 地圖容器 */
.map-container { position: relative; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }


/* 圖例 */
.map-legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    font-size: 0.8rem;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-item .box { width: 15px; height: 15px; border-radius: 3px; }
.level-4 { background: #e76f51; } /* 紅 - 嚴重 */
.level-3 { background: #f4a261; } /* 橙 - 偏重 */
.level-2 { background: #e9c46a; } /* 黃 - 中度 */
.level-1 { background: #8c9c75; } /* 綠 - 穩定 */

path:hover { filter: brightness(0.8); cursor: pointer; transition: 0.2s; }

    </style>
</head>
<body>

    <!-- 首頁 -->
    <section id="home" class="page-content active">
        <div class="hero-banner">
    <div class="hero-overlay">
        <h1>「糧」心大數據</h1>
    </div>
    <!-- 這裡放置你的圖片，或是用 CSS 背景圖 -->
    <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Sustainable Food" class="hero-img">
</div>
        <div class="info-container">
            <h2 style="text-align:center; color: #777; margin-bottom:30px; font-weight: 400;">飢餓觀察站</h2>
            
            <div class="news-placeholder">
                <h3>[ 此處展示 2026 氣候變遷與永續農糧新聞 ]</h3>
            </div>

            <div class="cta-container">
                <button class="btn-cta" onclick="showPage('calculator')">
                    <span class="icon">⚖️</span> 剩食計算機
                </button>
                <button class="btn-cta quiz-theme" onclick="showPage('quiz')">
                    <span class="icon">💡</span> 惜食小學堂
                </button>
                <button class="btn-cta secondary" onclick="showPage('map')">
                    <span class="icon">🌍</span> 全球飢餓地圖
                </button>
            </div>
        </div>

            <div class="petition-section">
                <h2>微型連署</h2>
                <p>您的每一次點擊，都是填滿空碗的一份希望。</p>
            
                <!-- 1. 這裡幫按鈕加了 id="pledgeBtn"，以便後面用 JS 控制它變灰 -->
                <button id="pledgeBtn" class="btn-promise" onclick="incrementCounter()">我承諾</button>
            
                <div class="counter-container" style="margin-top:20px;">
                目前已有 <span id="count" class="count-num">0</span> 位夥伴參與
            </div>
        </div>
    </section>

    <!-- 計算機頁面 -->
    <section id="calculator" class="page-content">
        <button class="btn-back" onclick="showPage('home')">← 返回首頁</button>
        <h1 style="text-align:center; color: var(--primary-color); margin-bottom:20px;">剩食計算機</h1>
        <div class="calc-wrapper">
            <div class="calc-form">
                <h3 style="margin-bottom:10px;">數據輸入</h3>
                <div class="input-group">
                    <label>1. 食物類別</label>
                    <select id="food-type">
                        <option value="0">請選擇類別...</option>
                        <option value="1.3">米飯/麵食 (1.3 kcal/g)</option>
                        <option value="2.5">肉類 (2.5 kcal/g)</option>
                        <option value="0.4">蔬菜 (0.4 kcal/g)</option>
                        <option value="0.6">水果 (0.6 kcal/g)</option>
                        <option value="3.5">速食/油炸物 (3.5 kcal/g)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>2. 浪費比例 (<span id="ratio-text">50</span>%)</label>
                    <input type="range" id="waste-ratio" min="0" max="100" value="50" class="slider" oninput="updateRatio(this.value)">
                </div>
                <div class="input-group">
                    <label>3. 平均一餐總重 (g)</label>
                    <input type="number" id="food-weight" placeholder="例如：500" min="0">
                </div>
                <button class="btn-calc" onclick="runCalc()">立即計算</button>
                <div id="formula-display" class="formula-box">
                    <span id="process-text"></span>
                </div>
            </div>
            <div class="calc-visual">
                <div class="balance-icon" id="balance-img"></div>
                <div id="result-msg" style="font-weight:600; color:var(--primary-color);">請點擊計算</div>
            </div>
        </div>
    </section>

    <!-- 惜食小學堂頁面 -->
    <section id="quiz" class="page-content">
        <button class="btn-back" onclick="showPage('home')">← 返回首頁</button>
        <h1 style="text-align:center; color: var(--primary-color); margin-bottom:10px;">惜食小學堂</h1>
        <p style="text-align:center; margin-bottom:30px; color:#888;" id="quiz-progress">第 1 / 15 題</p>
        
        <div class="quiz-container">
            <div id="quiz-box">
                <p class="quiz-question" id="question-text">載入中...</p>
                <div class="quiz-options-grid" id="options-container">
                    <!-- 選項將由 JS 自動生成 -->
                </div>
                <div id="quiz-feedback" class="quiz-feedback"></div>
                <button class="btn-calc" style="display:none; margin: 20px auto 0;" id="next-btn" onclick="nextQuestion()">下一題</button>
            </div>
        </div>
    </section>

       <!-- 地圖頁面 -->
    <section id="map" class="page-content">
    <button class="btn-back" onclick="showPage('home')">← 返回首頁</button>
    <h1 style="text-align:center; color: var(--primary-color); margin-bottom:10px;">全球飢餓狀況地圖</h1>
    <p style="text-align:center; color:#888; margin-bottom:20px;">2026 全球營養不良人口分佈圖 </p>
<div class="map-container" style="text-align: center;">
    <div id="map-tooltip" class="map-tooltip"></div>

    <div style="position: relative; display: inline-block;">
        <img src="https://www.eion.com.tw/Blogger/illustration/world-map/world-map-borders.png" alt="全球地圖" style="width: 100%; max-width: 900px; border-radius: 10px;">
        
        <div class="map-point" style="top: 30%; left: 20%;" onmouseover="showTip('北美', '2.5%', '持平')" onmouseout="hideTip()"></div>
        <div class="map-point" style="top: 70%; left: 30%;" onmouseover="showTip('拉丁美洲', '8.6%', '↑ 0.3%')" onmouseout="hideTip()"></div>
        <div class="map-point" style="top: 60%; left: 50%;" onmouseover="showTip('次撒哈拉非洲', '24.9%', '↑ 1.2%')" onmouseout="hideTip()"></div>
        <div class="map-point" style="top: 40%; left: 75%;" onmouseover="showTip('南亞', '16.4%', '↓ 0.5%')" onmouseout="hideTip()"></div>
    </div>

    <div class="map-legend">
        <div class="legend-item"><span class="box level-4"></span> 非常嚴重 (>25%)</div>
        <div class="legend-item"><span class="box level-3"></span> 嚴重 (15-25%)</div>
        <div class="legend-item"><span class="box level-2"></span> 中度 (5-15%)</div>
        <div class="legend-item"><span class="box level-1"></span> 穩定 (<5%)</div>
    </div>
</div>
    <script>
        // --- 通用頁面切換 ---
        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.style.display = 'none');
            const target = document.getElementById(pageId);
            if (target) target.style.display = 'block';
            window.scrollTo(0, 0);
        }

        // --- 計算機邏輯 ---
        function updateRatio(val) { document.getElementById('ratio-text').innerText = val; }
        function runCalc() {
            const density = parseFloat(document.getElementById('food-type').value);
            const ratio = parseFloat(document.getElementById('waste-ratio').value) / 100;
            const weight = parseFloat(document.getElementById('food-weight').value);
            if (density === 0 || isNaN(weight) || weight < 0) { alert("請輸入正確數據！"); return; }
            const kcal = (weight * ratio * density).toFixed(1);
            document.getElementById('formula-display').style.display = 'block';
            document.getElementById('process-text').innerHTML = `總計浪費熱量：<strong>${kcal} kcal</strong>`;
            document.getElementById('balance-img').style.transform = `rotate(${(ratio * 40) - 20}deg)`;
            document.getElementById('result-msg').innerHTML = `浪費了 <span style="font-size:1.4rem; color:#e67e22;">${kcal}</span> 大卡`;
        }

        // --- 惜食小學堂邏輯 (15題選擇題) ---
        const quizData = [
            { 
                q: "食品包裝上的「賞味期限」（Best Before）與「有效日期」（Use By）有何本質上的法律與科學差異？", 
                o: ["(A) 兩者皆指安全性", "(B) 前者指品質穩定性，後者指安全性", "(C) 兩者皆指口感", "(D) 前者受法律規範，後者不受"], 
                a: 1, 
                d: "「賞味期限」指在該日期前品質最佳，過期不代表不能食用；「有效日期」則是微生物安全性的分界點，過期可能導致食物中毒。" 
            },
            { 
                q: "根據數據，生產 1 公斤的哪類食物所耗費的虛擬水（Virtual Water）最高？", 
                o: ["(A) 小麥", "(B) 雞肉", "(C) 牛肉", "(D) 蘋果"], 
                a: 2, 
                d: "生產 1 公斤牛肉約需 15,000 公升的水。浪費肉類除了造成碳排放，更涉及更高昂的生物能損耗。" 
            },
            { 
                q: "所謂「醜食」是指外觀不符合規格的農產品。這類食物在供應鏈哪一階段浪費最嚴重？", 
                o: ["(A) 消費端", "(B) 零售端", "(C) 生產與採收後處理端", "(D) 烹飪端"], 
                a: 2, 
                d: "大量符合品質但外觀欠佳的蔬菜，因無法進入自動化包裝或連鎖超市的標準，在產地即被棄置。" 
            },
            { 
                q: "為什麼食物在掩埋場分解對氣候變遷的危害，大於其在自然環境下分解？", 
                o: ["(A) 產生大量二氧化碳", "(B) 缺乏氧氣產生甲烷", "(C) 污染地下水", "(D) 產生熱能"], 
                a: 1, 
                d: "掩埋場是缺氧環境，有機物會進行厭氧分解產生甲烷（CH4），其溫室效應潛力是二氧化碳的 25 倍以上。" 
            },
            { 
                q: "聯合國 SDG 12.3 的目標是到 2030 年將全球零售及消費端的食物浪費量減少多少？", 
                o: ["(A) 20%", "(B) 30%", "(C) 50%", "(D) 100%"], 
                a: 2, 
                d: "該目標明確要求將零售與消費端的糧食浪費減半，並減少生產與供應鏈中的糧食損失。" 
            },
            { 
                q: "在發展中國家，糧食損失（Food Loss）的主要瓶頸通常為何？", 
                o: ["(A) 消費者購買過多", "(B) 零售規格太嚴", "(C) 基礎冷鏈設施與儲存技術不足", "(D) 快餐文化"], 
                a: 2, 
                d: "發展中國家的損失多發生在「採收後」至「零售前」，因缺乏溫控物流導致食物變質。" 
            },
            { 
                q: "國際上常用來保護捐贈食物者（在無惡意情況下）免於法律責任的法律被稱為什麼？", 
                o: ["(A) 善意撒馬利亞人法", "(B) 消費者保護法", "(C) 食安基本法", "(D) 誠信交易法"], 
                a: 0, 
                d: "Good Samaritan Laws 旨在鼓勵剩食捐贈，降低捐贈者因食物中毒風險而被告的擔憂。" 
            },
            { 
                q: "如果將「食物浪費」比喻為一個國家，其碳排放量在全球排名第幾？", 
                o: ["(A) 第一", "(B) 第三", "(C) 第十", "(D) 第五十"], 
                a: 1, 
                d: "食物浪費造成的碳排僅次於中國與美國，佔全球總排放約 8% - 10%。" 
            },
            {

        let currentQuizIndex = 0;
        let hasAnswered = false;

        function loadQuestion() {
            hasAnswered = false;
            const qData = quizData[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `第 ${currentQuizIndex + 1} / ${quizData.length} 題`;
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            qData.o.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const qData = quizData[currentQuizIndex];
            const feedback = document.getElementById('quiz-feedback');
            const allBtns = document.querySelectorAll('.btn-option');

            allBtns.forEach((btn, index) => {
                btn.disabled = true;
                if (index === qData.a) {
                    btn.classList.add('correct');
                }
            });

            feedback.style.display = 'block';
            if (selectedIndex === qData.a) {
                feedback.innerHTML = `<strong>✅ 答對了！</strong><br>${qData.d}`;
                feedback.className = "quiz-feedback success";
            } else {
                clickedBtn.classList.add('wrong');
                feedback.innerHTML = `<strong>❌ 答錯了！正確答案是 ${qData.o[qData.a]}</strong><br>${qData.d}`;
                feedback.className = "quiz-feedback error";
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuizIndex++;
            if (currentQuizIndex < quizData.length) {
                loadQuestion();
            } else {
                // 結束畫面
                document.getElementById('quiz-box').innerHTML = `
                    <div style="text-align:center; padding:20px;">
                        <h2 style="color:var(--primary-color)">挑戰完成！</h2>
                        <p style="margin:20px 0;">你已經掌握了 15 個關鍵的食物永續觀念。</p>
                        <button class="btn-calc" onclick="location.reload()">重新挑戰</button>
                    </div>
                `;
            }
        }

        // 初始化
        loadQuestion();
        showPage('home');
    </script>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ 別忘了貼上你真正的 Firebase 金鑰喔！
    const firebaseConfig = {
    apiKey: "AIzaSyA81lxUpjZKpoju-ECSfsOYwqZC_aoSnPI",
    authDomain: "petition-count.firebaseapp.com",
    projectId: "petition-count",
    storageBucket: "petition-count.firebasestorage.app",
    messagingSenderId: "185724781337",
    appId: "1:185724781337:web:b84a8d60437ca9a500bb88"
  };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const pledgeRef = ref(db, 'pledge_total');
    const pledgeBtn = document.getElementById('pledgeBtn');

    // 本機 LocalStorage 防刷檢查
    function checkPledgeStatus() {
        if (localStorage.getItem('has_pledged') === 'true') {
            pledgeBtn.innerText = '感謝您的承諾';
            pledgeBtn.disabled = true; 
            pledgeBtn.style.opacity = '0.6'; 
            pledgeBtn.style.cursor = 'not-allowed';
        }
    }

    checkPledgeStatus();

    // 監聽雲端總數
    onValue(pledgeRef, (snapshot) => {
        const data = snapshot.val() || 0;
        document.getElementById('count').innerText = data.toLocaleString();
    });

    // 把全域的按鈕事件綁定到 window 上，這樣 HTML 裡的 onclick="incrementCounter()" 才能順利觸獲
    window.incrementCounter = function() {
        if (localStorage.getItem('has_pledged') === 'true') return;

        localStorage.setItem('has_pledged', 'true');
        checkPledgeStatus();

        runTransaction(pledgeRef, (currentCount) => {
        return (currentCount || 0) + 1;
        }).catch((error) => {
        console.error("連署失敗：", error);
        localStorage.removeItem('has_pledged');
        pledgeBtn.disabled = false;
        pledgeBtn.innerText = '我承諾';
        pledgeBtn.style.opacity = '1';
        pledgeBtn.style.cursor = 'pointer';
        });
    }
    </script>
