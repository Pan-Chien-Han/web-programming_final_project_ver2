<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「糧」心大數據 - ESG Impact</title>
    <style>
        :root {
            --bg-color: #f8f9f2;
            --primary-color: #8c9c75;
            --accent-color: #d4a373;
            --quiz-color: #6b8e23;
            --text-color: #4a4a4a;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            padding-top: 20px;
        }

        /* 內容區塊控制 */
        .page-content {
            display: none;
            padding: 40px 25px;
            max-width: 1100px;
            margin: 0 auto;
            min-height: 75vh;
        }
        .page-content.active { display: block; }

        /* 返回按鈕 */
        .btn-back {
            background: none;
            border: 1.5px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .btn-back:hover {
            background: var(--primary-color);
            color: white;
        }

        /* 首頁資訊樣式 */
        .news-placeholder {
            background: var(--white);
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            color: #999;
            border: 2px dashed #e0e0e0;
            margin-bottom: 40px;
        }

        /* 功能引導按鈕 */
        .cta-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .btn-cta {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(140, 156, 117, 0.2);
        }
        .btn-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(140, 156, 117, 0.4);
            filter: brightness(1.05);
        }
        .btn-cta.secondary {
            background-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.2);
        }
        .btn-cta.quiz-theme {
            background-color: var(--quiz-color);
            box-shadow: 0 4px 15px rgba(107, 142, 35, 0.2);
        }

        /* 計算機樣式 */
        .calc-wrapper {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        .calc-form { padding: 40px; }
        .calc-visual { background-color: #f1f3e8; padding: 40px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="number"], select { width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 8px; outline: none; }
        .slider { width: 100%; accent-color: var(--primary-color); }
        .btn-calc { background-color: var(--primary-color); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
        .formula-box { background: #fdfdfd; border-left: 5px solid var(--accent-color); padding: 15px; margin-top: 20px; font-size: 0.9rem; display: none; }

        /* 惜食小學堂樣式 */
        .quiz-container {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 650px;
            margin: 20px auto;
        }
        .quiz-card {
            border: 2px solid #f1f3e8;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .quiz-question { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; color: var(--text-color); }
        .quiz-options { display: flex; justify-content: center; gap: 20px; }
        .btn-quiz { padding: 12px 40px; border-radius: 50px; border: none; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: 0.2s; }
        .btn-true { background-color: var(--primary-color); color: white; }
        .btn-false { background-color: var(--accent-color); color: white; }
        .quiz-feedback { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; line-height: 1.5; }
        .quiz-feedback.success { background-color: #f1f3e8; color: #5d6b4a; border: 1px solid var(--primary-color); }
        .quiz-feedback.error { background-color: #fff0f0; color: #a94442; border: 1px solid #ebccd1; }

        /* 天平動畫 */
        .balance-icon {
            width: 150px; height: 100px; border-bottom: 4px solid var(--primary-color);
            position: relative; margin-bottom: 20px; transition: transform 0.5s ease;
        }
        .balance-icon::after {
            content: ""; position: absolute; left: 50%; bottom: 0; width: 4px; height: 60px;
            background: var(--primary-color); transform: translateX(-2px);
        }

        /* 連署區塊 */
        .petition-section {
            text-align: center; padding: 60px 0; background: #fff; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02); margin-top: 50px;
        }
        .btn-promise {
            margin-top: 20px; padding: 18px 60px; background: var(--white);
            border: 3px solid var(--accent-color); color: var(--accent-color);
            cursor: pointer; box-shadow: 10px 10px 0px var(--accent-color);
            transition: 0.1s; font-weight: 800; font-size: 1.5rem;
        }
        .btn-promise:active { transform: translate(5px, 5px); box-shadow: 5px 5px 0px var(--accent-color); }
        .count-num { color: var(--accent-color); font-weight: 900; font-size: 1.8rem; margin: 0 5px; }

        /* 地圖佔位 */
        .map-placeholder {
            height: 500px; background-color: #e3eaf0; border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            color: #666; border: 2px solid #d1d9e0;
        }

        footer { text-align: center; padding: 40px; font-size: 0.85rem; color: #aaa; }

        @media (max-width: 850px) {
            .calc-wrapper { grid-template-columns: 1fr; }
            .cta-container { flex-direction: column; align-items: center; }
            .btn-cta { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- 首頁 -->
    <section id="home" class="page-content active">
        <div class="info-container">
            <h1 style="text-align:center; color: var(--primary-color); margin-bottom:10px;">ESG Impact</h1>
            <h2 style="text-align:center; color: #777; margin-bottom:30px; font-weight: 400;">飢餓觀察站</h2>
            
            <div class="news-placeholder">
                <h3>[ 此處將會放置 ESG 新聞、文章或專案介紹 ]</h3>
            </div>

            <div class="cta-container">
                <button class="btn-cta" onclick="showPage('calculator')">
                    <span class="icon">⚖️</span> 剩食計算機
                </button>
                <button class="btn-cta quiz-theme" onclick="showPage('quiz')">
                    <span class="icon">💡</span> 惜食小學堂
                </button>
                <button class="btn-cta secondary" onclick="showPage('map')">
                    <span class="icon">🌍</span> 全球飢餓地圖
                </button>
            </div>
        </div>

        <div class="petition-section">
            <h2>微型連署</h2>
            <p>您的每一次點擊，都是填滿空碗的一份希望。</p>
            <button class="btn-promise" onclick="incrementCounter()">我承諾</button>
            <div class="counter-container" style="margin-top:20px;">
                目前已有 <span id="count" class="count-num">0</span> 位夥伴參與
            </div>
        </div>
    </section>

    <!-- 計算機頁面 -->
    <section id="calculator" class="page-content">
        <button class="btn-back" onclick="showPage('home')">← 返回首頁</button>
        <h1 style="text-align:center; color: var(--primary-color); margin-bottom:20px;">剩食計算機</h1>
        <div class="calc-wrapper">
            <div class="calc-form">
                <h3 style="margin-bottom:10px;">數據輸入</h3>
                <div class="input-group">
                    <label>1. 食物類別</label>
                    <select id="food-type">
                        <option value="0">請選擇類別...</option>
                        <option value="1.3">米飯/麵食 (1.3 kcal/g)</option>
                        <option value="2.5">肉類 (2.5 kcal/g)</option>
                        <option value="0.4">蔬菜 (0.4 kcal/g)</option>
                        <option value="0.6">水果 (0.6 kcal/g)</option>
                        <option value="3.5">速食/油炸物 (3.5 kcal/g)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>2. 浪費比例 (<span id="ratio-text">50</span>%)</label>
                    <input type="range" id="waste-ratio" min="0" max="100" value="50" class="slider" oninput="updateRatio(this.value)">
                </div>
                <div class="input-group">
                    <label>3. 平均一餐總重 (g)</label>
                    <input type="number" id="food-weight" placeholder="例如：500" min="0">
                </div>
                <button class="btn-calc" onclick="runCalc()">立即計算</button>
                <div id="formula-display" class="formula-box">
                    <span id="process-text"></span>
                </div>
            </div>
            <div class="calc-visual">
                <div class="balance-icon" id="balance-img"></div>
                <div id="result-msg" style="font-weight:600; color:var(--primary-color);">請點擊計算</div>
            </div>
        </div>
    </section>

    <!-- 惜食小學堂頁面 -->
    <section id="quiz" class="page-content">
        <button class="btn-back" onclick="showPage('home')">← 返回首頁</button>
        <h1 style="text-align:center; color: var(--primary-color); margin-bottom:30px;">惜食小學堂</h1>
        <div class="quiz-container">
            <div class="quiz-card">
                <p class="quiz-question" id="question-text">載入中...</p>
                <div class="quiz-options">
                    <button class="btn-quiz btn-true" onclick="checkAnswer(true)">O 正確</button>
                    <button class="btn-quiz btn-false" onclick="checkAnswer(false)">X 錯誤</button>
                </div>
            </div>
            <div id="quiz-feedback" class="quiz-feedback"></div>
            <button class="btn-calc" style="margin-top:20px; display:none;" id="next-btn" onclick="nextQuestion()">下一題</button>
        </div>
    </section>

    <!-- 地圖頁面 -->
    <section id="map" class="page-content">
        <button class="btn-back" onclick="showPage('home')">← 返回首頁</button>
        <h1 style="text-align:center; color: var(--primary-color); margin-bottom:30px;">全球飢餓狀況地圖</h1>
        <div class="map-placeholder">
            <p>🌍 [ 世界地圖展示空間 ]</p>
        </div>
    </section>

    <footer>&copy; 2026 ESG Sustainable Future Project</footer>

    <script>
        // --- 通用頁面切換 ---
        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.style.display = 'none');
            const target = document.getElementById(pageId);
            if (target) target.style.display = 'block';
            window.scrollTo(0, 0);
        }

        // --- 連署邏輯 ---
        let pledgeCount = localStorage.getItem('pledge_total') ? parseInt(localStorage.getItem('pledge_total')) : 0;
        document.getElementById('count').innerText = pledgeCount.toLocaleString();
        function incrementCounter() {
            pledgeCount++;
            document.getElementById('count').innerText = pledgeCount.toLocaleString();
            localStorage.setItem('pledge_total', pledgeCount);
        }

        // --- 計算機邏輯 ---
        function updateRatio(val) { document.getElementById('ratio-text').innerText = val; }
        function runCalc() {
            const density = parseFloat(document.getElementById('food-type').value);
            const ratio = parseFloat(document.getElementById('waste-ratio').value) / 100;
            const weight = parseFloat(document.getElementById('food-weight').value);
            if (density === 0 || isNaN(weight) || weight < 0) { alert("請輸入正確數據！"); return; }
            const kcal = (weight * ratio * density).toFixed(1);
            document.getElementById('formula-display').style.display = 'block';
            document.getElementById('process-text').innerHTML = `總計浪費熱量：<strong>${kcal} kcal</strong>`;
            document.getElementById('balance-img').style.transform = `rotate(${(ratio * 40) - 20}deg)`;
            document.getElementById('result-msg').innerHTML = `浪費了 <span style="font-size:1.4rem; color:#e67e22;">${kcal}</span> 大卡`;
        }

        // --- 惜食小學堂邏輯 ---
        const quizData = [
            { q: "全球每年生產的食物中，大約有三分之一被浪費掉？", a: true, info: "正確！根據聯合國統計，全球每年浪費約 13 億噸食物。" },
            { q: "把所有剩食丟進垃圾桶是最環保的處理方式？", a: false, info: "錯誤！剩食掩埋會產生甲烷，應優先減量或做成堆肥。" },
            { q: "香蕉放在冰箱裡可以保存得更久且不會變黑？", a: false, info: "錯誤！香蕉是熱帶水果，進冰箱會受寒害導致果皮變黑。" },
            { q: "「醜蔬果」雖然外型不佳，但營養價值與普通蔬果相同？", a: true, info: "正確！選擇醜蔬果能有效減少農業資源浪費。" }
        ];
        let currentQuizIndex = 0;
        function loadQuestion() {
            const q = quizData[currentQuizIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('quiz-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }
        function checkAnswer(userAns) {
            const q = quizData[currentQuizIndex];
            const feedback = document.getElementById('quiz-feedback');
            feedback.style.display = 'block';
            if (userAns === q.a) {
                feedback.innerHTML = `<strong>太棒了！答對了！</strong><br>${q.info}`;
                feedback.className = "quiz-feedback success";
            } else {
                feedback.innerHTML = `<strong>答錯囉，再接再厲！</strong><br>${q.info}`;
                feedback.className = "quiz-feedback error";
            }
            document.getElementById('next-btn').style.display = 'inline-block';
        }
        function nextQuestion() {
            currentQuizIndex = (currentQuizIndex + 1) % quizData.length;
            loadQuestion();
        }

        // 初始化
        loadQuestion();
        showPage('home');
    </script>
</body>
</html>
